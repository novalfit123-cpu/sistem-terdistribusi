<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TemuKos Map - Client REST API & Peta</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Leaflet CSS & JS (Peta Interaktif) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body class="bg-gray-100 font-sans text-gray-800">
    <!-- Header Navigation -->
    <header class="bg-emerald-950 text-white shadow-md">
      <div
        class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center"
      >
        <h1 class="text-2xl font-bold flex items-center gap-2">
          <i class="bi bi-houses"></i> TemuKos
        </h1>
        <nav class="flex gap-4">
          <button
            onclick="switchTab('pencarian')"
            id="btn-tab-cari"
            class="bg-emerald-800 px-4 py-2 rounded-lg font-medium hover:bg-emerald-600"
          >
            <i class="bi bi-search"></i> Cari Kos & Peta
          </button>
          <button
            onclick="switchTab('favorit')"
            id="btn-tab-fav"
            class="bg-emerald-800 px-4 py-2 rounded-lg font-medium hover:bg-emerald-600"
          >
            <i class="bi bi-heart"></i> Favorit Saya
          </button>
        </nav>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
      <!-- TAB PENCARIAN & PETA -->
      <section id="tab-pencarian" class="space-y-6">
        <!-- PETA INTERAKTIF -->
        <div class="bg-white p-4 rounded-xl shadow-sm space-y-2">
          <div class="flex justify-between items-center">
            <h2 class="font-bold text-gray-700"><i class="bi bi-map"></i> Peta Sebaran Lokasi Kos</h2>
            <span class="text-xs text-gray-500"
              >Powered by Esri World Street Map</span
            >
          </div>
          <div id="map" class="h-80 w-full rounded-xl border z-10"></div>
        </div>

        <!-- Search & Filter Bar -->
        <div
          class="bg-white p-4 rounded-xl shadow-sm flex flex-col md:flex-row gap-4 justify-between items-center"
        >
          <div class="flex-1 w-full flex gap-2">
            <input
              type="text"
              id="input-search"
              placeholder="Cari kos berdasarkan nama atau kota..."
              class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500"
            />
            <button
              onclick="fetchKos()"
              class="bg-emerald-800 text-white px-5 py-2 rounded-lg hover:bg-emerald-600"
            >
              Cari
            </button>
          </div>
          <button
            onclick="toggleModal(true)"
            class="bg-emerald-800 text-white px-4 py-2 rounded-lg hover:bg-emerald-600 w-full md:w-auto font-medium"
          >
            <i class="bi bi-plus"></i> Tambah Kos Baru
          </button>
        </div>

        <!-- List Cards -->
        <div id="kos-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
      </section>

      <!-- TAB FAVORIT -->
      <section id="tab-favorit" class="space-y-6 hidden">
        <h2 class="text-xl font-bold text-gray-700">Daftar Kos Favorit</h2>
        <div
          id="favorit-list"
          class="grid grid-cols-1 md:grid-cols-3 gap-6"
        ></div>
      </section>
    </main>

    <!-- MODAL FORM TAMBAH -->
    <div
      id="modal-tambah"
      class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50"
    >
      <div class="bg-white w-full max-w-md p-6 rounded-xl shadow-xl">
        <h3 class="text-lg font-bold mb-4">Tambah Kos Baru</h3>
        <p class="text-xs text-gray-500 mb-3">
          *Sistem akan otomatis mengambil titik koordinat lokasi via
          OpenStreetMap Geocoding API.
        </p>
        <form
          id="form-tambah-kos"
          onsubmit="handleTambahKos(event)"
          class="space-y-3"
        >
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1"
              >Nama Kos</label
            >
            <input
              type="text"
              id="nama_kos"
              required
              class="w-full border rounded p-2 text-sm"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1"
              >Lokasi / Alamat Kota</label
            >
            <input
              type="text"
              id="lokasi"
              placeholder="Misal: Tembalang Semarang"
              required
              class="w-full border rounded p-2 text-sm"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1"
              >Harga Bulanan (Rp)</label
            >
            <input
              type="number"
              id="harga_bulanan"
              required
              class="w-full border rounded p-2 text-sm"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1"
              >Fasilitas</label
            >
            <input
              type="text"
              id="fasilitas"
              placeholder="AC, Wi-Fi, Kasur"
              class="w-full border rounded p-2 text-sm"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1"
              >URL Gambar Kos</label
            >
            <input
              type="url"
              id="gambar_url"
              class="w-full border rounded p-2 text-sm"
            />
          </div>
          <div class="flex justify-end gap-2 mt-4 pt-2 border-t">
            <button
              type="button"
              onclick="toggleModal(false)"
              class="bg-red-800 text-white px-4 py-2 rounded text-sm hover:bg-red-600"
            >
              Batal
            </button>
            <button
              type="submit"
              id="btn-submit"
              class="bg-emerald-800 text-white px-4 py-2 rounded text-sm hover:bg-emerald-600"
            >
              Simpan Data
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- JAVASCRIPT CLIENT -->
    <script>
      const API_BASE = "http://localhost:3000/api";
      let map, markersGroup;

      document.addEventListener("DOMContentLoaded", () => {
        initMap();
        fetchKos();
      });

      // Inisialisasi Peta Leaflet menggunakan Tile Server Esri ArcGIS (Gratis, Tanpa API Key & Tanpa Watermark)
      function initMap() {
        map = L.map("map").setView([-6.9826, 110.4091], 12);

        L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
          {
            attribution: "Tiles &copy; Esri &mdash; Source: Esri, USGS, NOAA",
          },
        ).addTo(map);

        markersGroup = L.layerGroup().addTo(map);
      }

      function switchTab(tab) {
        if (tab === "pencarian") {
          document.getElementById("tab-pencarian").classList.remove("hidden");
          document.getElementById("tab-favorit").classList.add("hidden");
          fetchKos();
        } else {
          document.getElementById("tab-pencarian").classList.add("hidden");
          document.getElementById("tab-favorit").classList.remove("hidden");
          fetchFavorit();
        }
      }

      function toggleModal(show) {
        document
          .getElementById("modal-tambah")
          .classList.toggle("hidden", !show);
      }

      // 1. GET /api/kos (Fetch Kos & Tampilkan Marker di Peta)
      async function fetchKos() {
        const query = document.getElementById("input-search").value;
        const container = document.getElementById("kos-list");
        container.innerHTML =
          '<p class="text-gray-500 col-span-3">Memuat data dari API...</p>';

        try {
          const res = await fetch(
            `${API_BASE}/kos?q=${encodeURIComponent(query)}`,
          );
          const responseData = await res.json();
          const kosData = responseData.data;

          // Reset Marker Peta
          markersGroup.clearLayers();

          if (!kosData || kosData.length === 0) {
            container.innerHTML =
              '<p class="text-gray-500 col-span-3">Data kos tidak ditemukan.</p>';
            return;
          }

          // Plot Marker Peta untuk setiap Kos
          kosData.forEach((item) => {
            if (item.latitude && item.longitude) {
              const marker = L.marker([
                item.latitude,
                item.longitude,
              ]).bindPopup(
                `<b>${item.nama_kos}</b><br>Rp ${item.harga_bulanan.toLocaleString("id-ID")}/bln`,
              );
              markersGroup.addLayer(marker);
            }
          });

          // Render Kartu Kos
          container.innerHTML = kosData
            .map(
              (item) => `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden flex flex-col justify-between">
                        <div>
                            <img src="${item.gambar_url}" alt="${item.nama_kos}" class="h-44 w-full object-cover">
                            <div class="p-4">
                                <span class="text-xs font-semibold uppercase text-amber-800">${item.lokasi}</span>
                                <h3 class="font-bold text-lg mt-1">${item.nama_kos}</h3>
                                <p class="text-emerald-800 font-bold text-md mt-1">Rp ${item.harga_bulanan.toLocaleString("id-ID")} / bulan</p>
                                <p class="text-xs text-gray-500 mt-2"><strong>Fasilitas:</strong> ${item.fasilitas}</p>
                                <p class="text-[10px] text-gray-400 mt-1"><i class="bi bi-geo-alt" style="color: red;""></i> Lat: ${item.latitude}, Lon: ${item.longitude}</p>
                            </div>
                        </div>
                        <div class="p-4 border-t flex justify-between gap-2 bg-gray-50">
                            <button onclick="tambahFavorit(${item.id})" class="text-sm bg-gray-400 text-emerald-800 hover:bg-emerald-600 px-3 py-1.5 rounded-lg flex-1 font-medium"><i class="bi bi-heart"></i> Favorit</button>
                            <button onclick="hapusKos(${item.id})" class="text-sm bg-gray-400 text-white hover:bg-red-600 hover:text-grey-800 px-3 py-1.5 rounded-lg"><i class="bi bi-trash"></i> Hapus</button>
                        </div>
                    </div>
                `,
            )
            .join("");
        } catch (err) {
          container.innerHTML =
            '<p class="text-red-500 col-span-3">Gagal terhubung ke API Server. Pastikan `node server.js` sudah berjalan.</p>';
        }
      }

      // 2. POST /api/kos (Simpan Data & Geocode via API Luar)
      async function handleTambahKos(e) {
        e.preventDefault();
        const btnSubmit = document.getElementById("btn-submit");
        btnSubmit.innerText = "Mencari Koordinat API...";
        btnSubmit.disabled = true;

        const payload = {
          nama_kos: document.getElementById("nama_kos").value,
          lokasi: document.getElementById("lokasi").value,
          harga_bulanan: parseInt(
            document.getElementById("harga_bulanan").value,
          ),
          fasilitas: document.getElementById("fasilitas").value,
          gambar_url: document.getElementById("gambar_url").value,
        };

        try {
          const res = await fetch(`${API_BASE}/kos`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          alert(data.message);
          toggleModal(false);
          document.getElementById("form-tambah-kos").reset();
          fetchKos();
        } catch (err) {
          alert("Gagal menambah data kos");
        } finally {
          btnSubmit.innerText = "Simpan Data";
          btnSubmit.disabled = false;
        }
      }

      // 3. DELETE /api/kos/:id
      async function hapusKos(id) {
        if (!confirm("Hapus data kos ini?")) return;
        try {
          const res = await fetch(`${API_BASE}/kos/${id}`, {
            method: "DELETE",
          });
          const data = await res.json();
          alert(data.message);
          fetchKos();
        } catch (err) {
          alert("Gagal menghapus");
        }
      }

      // 4. POST /api/favorit
      async function tambahFavorit(kos_id) {
        try {
          const res = await fetch(`${API_BASE}/favorit`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ kos_id, catatan: "Favorit Pilihan" }),
          });
          const data = await res.json();
          alert(data.message);
        } catch (err) {
          alert("Gagal menyimpan favorit");
        }
      }

      // 5. GET /api/favorit
      async function fetchFavorit() {
        const container = document.getElementById("favorit-list");
        try {
          const res = await fetch(`${API_BASE}/favorit`);
          const responseData = await res.json();
          if (!responseData.data || responseData.data.length === 0) {
            container.innerHTML =
              '<p class="text-gray-500 col-span-3">Belum ada kos favorit.</p>';
            return;
          }
          container.innerHTML = responseData.data
            .map(
              (item) => `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden p-4">
                        <h3 class="font-bold text-lg">${item.nama_kos}</h3>
                        <p class="text-indigo-600 font-semibold">${item.lokasi}</p>
                        <p class="text-emerald-600 font-bold mt-1">Rp ${item.harga_bulanan.toLocaleString("id-ID")} / bulan</p>
                        <button onclick="hapusFavorit(${item.favorit_id})" class="mt-4 w-full bg-red-100 text-red-600 py-1.5 rounded-lg text-sm">Hapus Favorit</button>
                    </div>
                `,
            )
            .join("");
        } catch (err) {
          container.innerHTML =
            '<p class="text-red-500">Gagal memuat favorit.</p>';
        }
      }

      // 6. DELETE /api/favorit/:id
      async function hapusFavorit(id) {
        try {
          await fetch(`${API_BASE}/favorit/${id}`, { method: "DELETE" });
          fetchFavorit();
        } catch (err) {
          alert("Gagal menghapus");
        }
      }
    </script>
  </body>
</html>
